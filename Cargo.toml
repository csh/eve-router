[package]
name = "eve-router"
version = "0.1.0"
edition = "2024"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rayon = "1.12"
petgraph = "0.8"
clap = { version = "4.6", features = ["derive"] }
ratatui = "0.30"
dirs = "7.0.0"
ureq = "3.4.2"
flate2 = "1.1.10"
chrono = "0.4.45"
mimalloc = "0.1.52"

[profile.release]
strip = "debuginfo"
codegen-units = 1
opt-level = 3
lto = "fat"
panic = "abort"
debug = false
debug-assertions = false
overflow-checks = false
incremental = false