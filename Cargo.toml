[workspace]
resolver = "3"
members = ["crates/router_core", "crates/router_egui", "crates/router_tui"]
# `cargo run` starts the TUI. `cargo test` also runs the core tests.
default-members = ["crates/router_tui", "crates/router_core"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
router_core = { path = "crates/router_core" }
rayon = "1.12"
petgraph = "0.8"
clap = { version = "4.6", features = ["derive"] }
mimalloc = "0.1.52"

[profile.release]
lto = "thin"

# The CI build and tests: the dev profile with line tables only, so the build cache stays small
# and a test failure still gives a backtrace with lines. No incremental files: CI builds once.
[profile.ci]
inherits = "dev"
debug = "line-tables-only"
incremental = false

# The binaries of a GitHub release: full LTO and one codegen unit for the smallest and fastest
# binary. The symbols go, because a release has no debugger.
[profile.dist]
inherits = "release"
lto = "fat"
codegen-units = 1
strip = true
