[package]
name = "router_core"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
publish = false

[features]
# The `test_support` module: fixtures, test servers and snapshot checks, for the tests and the
# bench of the other crates. It adds no code to the router itself, and a release build leaves it off.
test-support = []

[[bench]]
name = "core"
harness = false
required-features = ["test-support"]

[dependencies]
base64 = "0.23.1"
chrono = "0.4.45"
dirs = "7.0.0"
flate2 = "1.1.10"
httpdate = "1.0.3"
keyring = "4.2.0"
oauth2 = { version = "5.0.0", default-features = false }
petgraph.workspace = true
rayon.workspace = true
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0.21"
tiny_http = "0.12.0"
ureq = "3.4.2"
webbrowser = "1.2.4"

[dev-dependencies]
criterion = { version = "0.8.2", default-features = false, features = ["rayon", "cargo_bench_support"] }
tempfile = "3.27.0"
