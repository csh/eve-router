[package]
name = "router_core"
version.workspace = true
edition.workspace = true
publish = false

[features]
# The test helpers, for the tests of the other crates.
test-support = []
clap = ["dep:clap"]

[dependencies]
base64 = "0.23.1"
chrono = "0.4.45"
clap = { workspace = true, optional = true }
dirs = "7.0.0"
flate2 = "1.1.10"
httpdate = "1.0.3"
keyring = "4.2.0"
oauth2 = { version = "5.0.0", default-features = false }
petgraph.workspace = true
rayon.workspace = true
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tiny_http = "0.12.0"
ureq = "3.4.2"
