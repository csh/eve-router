[package]
name = "router_egui"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
publish = false

[[bin]]
name = "eve-router"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.36.2", default-features = false, features = ["glow", "accesskit", "links", "wayland", "x11"] }
egui = { version = "0.36.2", default-features = false }
egui-toast = "0.22.0"
egui_dnd = "0.17.0"
egui_extras = "0.36.2"
egui_phosphor_icons = { version = "0.5.0", default-features = false, features = ["fill"] }
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png"] }
mimalloc.workspace = true
petgraph.workspace = true
raw-window-handle = "0.6.2"
rayon.workspace = true
router_core.workspace = true
self_update = { version = "1.3.1", default-features = false, features = ["ureq", "rustls", "github", "checksums"] }
thiserror = "2.0.21"

[dev-dependencies]
router_core = { workspace = true, features = ["test-support"] }
tempfile = "3.27.0"

[target."cfg(windows)".dependencies]
self_update = { version = "1.3.1", default-features = false, features = ["archive-zip", "compression-zip-deflate"] }
windows = { version = "0.62.2", default-features = false, features = ["Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }

[target."cfg(not(windows))".dependencies]
self_update = { version = "1.3.1", default-features = false, features = ["archive-tar", "compression-tar-gz"] }
