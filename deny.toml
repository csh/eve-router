# `cargo deny check` examines the RustSec advisories, the licenses and the crate sources.
# Every license here is compatible with MIT OR Apache-2.0, the license of this project.

[advisories]
# A crate that is unmaintained or yanked also fails the check.
unmaintained = "all"
yanked = "deny"
# The Linux D-Bus stack (zbus) comes in through keyring and accesskit on Linux. Its crates are
# marked unmaintained, and no safe upgrade exists. They carry no vulnerability. Remove these
# lines when keyring and accesskit move to a maintained D-Bus crate.
ignore = [
    "RUSTSEC-2026-0370", # zvariant
    "RUSTSEC-2026-0371", # zbus_names
    "RUSTSEC-2026-0372", # zvariant_derive
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.9

# The workspace crates are not on crates.io.
[licenses.private]
ignore = true

[bans]
multiple-versions = "allow"
wildcards = "deny"
# The workspace crates use path dependencies with no version.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
